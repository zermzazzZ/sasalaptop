<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MSI Product</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

/* NAVBAR */

.navbar{
    background:#111;
    color:white;
    padding:18px 40px;
    font-size:28px;
    font-weight:bold;
}

/* PRODUCT */

.product{
    width:90%;
    max-width:1200px;
    margin:50px auto;
    background:white;
    border-radius:25px;
    padding:40px;
    display:flex;
    gap:50px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* IMAGE */

.product-image{
    flex:1;
    text-align:center;
}

.product-image img{
    width:100%;
    max-width:500px;
    transition:0.3s;
}

.product-image img:hover{
    transform:scale(1.05);
}

/* INFO */

.product-info{
    flex:1;
}

.product-info h1{
    font-size:45px;
    margin-bottom:20px;
}

.price{
    color:orangered;
    font-size:40px;
    font-weight:bold;
    margin-bottom:25px;
}

.spec{
    font-size:20px;
    line-height:2;
    color:#333;
}

.buy{
    margin-top:35px;
}

.buy button{
    padding:15px 35px;
    border:none;
    border-radius:12px;
    background:orange;
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.buy button:hover{
    background:#ff6600;
    transform:translateY(-3px);
}
.cart-btn{
    padding:15px 35px;
    border:none;
    border-radius:12px;
    background:orange;
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

.cart-btn:hover{
    background:#ff6600;
    transform:translateY(-3px);
}
</style>
</head>
<body>

<div class="navbar">
    SA Laptop
</div>

<div class="product">

    <div class="product-image">
        <img src="https://m.media-amazon.com/images/I/71gXelI8upL._AC_SL1500_.jpg">
    </div>

    <div class="product-info">

        <h1>acer Nitro V Gaming Laptop</h1>

        <div class="price">
          $799.99 
        </div>

        <div class="spec">
       | Intel Core i5-13420H Processor<br> | NVIDIA GeForce RTX 4050 Laptop GPU<br> | 15.6" FHD IPS 165Hz Display<br> | 8GB DDR5 <br>| 512GB Gen 4 SSD<br> | Wi-Fi 6 <br>| Backlit KB <br>| ANV15-52-586Z<br>
        </div>

        <div class="buy">
          <button class="addtocart.html" onclick="addToCart()">
    Add To Cart
</button>
        </div>

    </div>

</div>


<script>

function addToCart(){

    alert("Added To Cart");

    window.location.href = "addtocart.html";

}

</script>
</body>
</html>
