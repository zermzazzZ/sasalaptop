<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASA LAPTOP - Auth</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f0f0f;
}

/* CONTAINER */

.container{
    width:95%;
    max-width:1100px;
    background:rgba(255,255,255,.05);
    border-radius:25px;
    overflow:hidden;
    display:grid;
    grid-template-columns:1fr 1fr;
}

/* LEFT */

.left{
    background:#111;
    color:white;
    padding:50px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1{font-size:48px;}
.left p{margin-top:15px;opacity:.8;}

/* RIGHT */

.right{
    padding:40px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{width:100%;max-width:380px;}

/* TABS */

.tabs{
    display:flex;
    gap:20px;
    margin-bottom:25px;
}

.tab{
    cursor:pointer;
    font-weight:600;
    color:#777;
}

.tab.active{
    color:white;
    border-bottom:2px solid white;
}

/* FORM */

.form-title{color:white;font-size:26px;}
.form-sub{color:#aaa;font-size:14px;margin-bottom:20px;}

.group{margin-bottom:15px;}

.group label{color:#bbb;font-size:13px;}

.group input{
    width:100%;
    margin-top:5px;
    padding:14px;
    border-radius:10px;
    border:1px solid #333;
    background:#0d0d0d;
    color:white;
}

.group input:focus{
    outline:none;
    border-color:white;
}

/* BUTTON */

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:white;
    color:black;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

.btn:hover{transform:scale(1.03);}

/* SWITCH */

.switch{
    margin-top:15px;
    text-align:center;
    color:#aaa;
}

.switch span{
    color:white;
    cursor:pointer;
}

/* MESSAGE */

.msg{margin-top:10px;font-size:14px;color:#7CFC00;}
.err{color:#ff6b6b;}
.hidden{display:none;}

/* MOBILE */

@media(max-width:900px){
.container{grid-template-columns:1fr;}
.left{text-align:center;padding:30px 20px;}
.left h1{font-size:32px;}
.right{padding:30px 20px;}
}

</style>
</head>

<body>

<div class="container">

    <div class="left">
        <h1>SASA LAPTOP</h1>
        <p></p>
    </div>

    <div class="right">
        <div class="card">

            <div class="tabs">
                <div id="loginTab" class="tab active" onclick="showLogin()">Login</div>
                <div id="signupTab" class="tab" onclick="showSignup()">Sign Up</div>
            </div>

            <!-- LOGIN -->
            <div id="loginBox">

                <div class="form-title">Welcome Back</div>
                <div class="form-sub">Login to continue</div>

                <div class="group">
                    <label>Email</label>
                    <input id="loginUser">
                </div>

                <div class="group">
                    <label>Password</label>
                    <input id="loginPass" type="password">
                </div>

                <button class="btn" onclick="login()">LOGIN</button>

                <div class="switch">
                    New user? <span onclick="showSignup()">Sign up</span>
                </div>

                <div id="loginMsg" class="msg"></div>

            </div>

            <!-- SIGNUP -->
            <div id="signupBox" class="hidden">

                <div class="form-title">Create Account</div>
                <div class="form-sub">Register new account</div>

                <div class="group">
                    <label>Email</label>
                    <input id="regUser">
                </div>

                <div class="group">
                    <label>Password</label>
                    <input id="regPass" type="password">
                </div>

                <button class="btn" onclick="signup()">SIGN UP</button>

                <div class="switch">
                    Have account? <span onclick="showLogin()">Login</span>
                </div>

                <div id="signupMsg" class="msg"></div>

            </div>

        </div>
    </div>

</div>

<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* 🔴 DÁN CONFIG CỦA BẠN */
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

/* UI */

window.showSignup = () => {
    $('loginBox').classList.add('hidden');
    $('signupBox').classList.remove('hidden');
};

window.showLogin = () => {
    $('signupBox').classList.add('hidden');
    $('loginBox').classList.remove('hidden');
};

/* SIGNUP */

window.signup = async () => {

    let email = $('regUser').value.trim();
    let pass = $('regPass').value.trim();

    if(!email || !pass){
        return msg('signupMsg','Fill all fields',1);
    }

    try{
        await createUserWithEmailAndPassword(auth,email,pass);
        msg('signupMsg','Signup success');
        setTimeout(showLogin,800);
    }catch(err){
        msg('signupMsg',err.message,1);
    }

};

/* LOGIN */

window.login = async () => {

    let email = $('loginUser').value.trim();
    let pass = $('loginPass').value.trim();

    try{
        await signInWithEmailAndPassword(auth,email,pass);
        msg('loginMsg','Login success');

        setTimeout(()=>{
            window.location.href="home.html";
        },800);

    }catch(err){
        msg('loginMsg',err.message,1);
    }

};

function msg(id,text,error){
    let el=$(id);
    el.textContent=text;
    el.className='msg'+(error?' err':'');
}

</script>

</body>
</html>
